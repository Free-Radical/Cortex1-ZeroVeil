[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex1-zeroveil-community"
version = "0.2.0"
description = "Self-hosted LLM gateway: refuses prompts unless zero data retention is requested and redaction is attested; metadata-only audit log."
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0 (plus PolyForm-Free-Trial-1.0.0 for 32-day commercial evaluation)" }
dependencies = [
  "fastapi>=0.115",
  "requests>=2.31",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[project.urls]
Homepage = "https://zeroveil.io"
Repository = "https://github.com/Free-Radical/Cortex1-ZeroVeil"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
